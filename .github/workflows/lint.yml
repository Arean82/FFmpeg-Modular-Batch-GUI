name: Quality Gates & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: Lint & Smoke Test (Python 3.10 - 3.12)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      NO_AT_SPI: "1"
      QT_ACCESSIBILITY: "0"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install System Dependencies for Headless Qt & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Validate Python Syntax & Compilation
        run: |
          python -m py_compile main.py core/*.py

      - name: UI & Architecture Smoke Test
        run: |
          python -c "
          import os
          os.environ['QT_QPA_PLATFORM'] = 'offscreen'
          from PySide6.QtWidgets import QApplication
          from core.theme_manager import ThemeManager
          from core.presets import load_presets
          from main import FFBatchApp

          app = QApplication([])
          theme = ThemeManager()
          theme.apply_current_theme(app)
          presets = load_presets()
          assert len(presets) > 0, 'Presets failed to load'
          win = FFBatchApp()
          assert win is not None, 'Window failed to instantiate'
          print('CI Smoke Test Passed Successfully')
          "
