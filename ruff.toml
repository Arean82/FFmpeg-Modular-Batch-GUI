# Ruff linter configuration for FFmpeg Modular Batch AV Converter
target-version = "py310"
line-length = 120

extend-exclude = [
    "legacy",
    "build",
    "dist",
    ".venv",
    "venv",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by line-length/formatter)
    "B008", # function calls in argument defaults
]

[lint.isort]
known-first-party = ["core"]
