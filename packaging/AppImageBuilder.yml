version: 1
AppDir:
  app_info:
    id: in.synorastudio.FFmpegBatchGUI
    name: FFmpeg Batch AV Converter
    icon: assets/app_icon
    version: 1.0.0
    exec: usr/bin/python3
    exec_args: "$@ -m main"

  apt:
    arch: [amd64]
    sources:
      - sourceline: 'deb http://archive.ubuntu.com/ubuntu/ noble main universe'
    include:
      - python3-pyside6.qtwidgets
      - python3-pyside6.qtcore
      - python3-pyside6.qtgui
      - python3-pyside6.qtmultimedia
      - python3-pyside6.qtmultimediawidgets
      - python3-pyside6.qtwebenginecore
      - python3-pyside6.qtwebenginewidgets
      - ffmpeg
      - libnotify-bin

AppImage:
  arch: x86_64
